name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore BoardGameLibrary.sln --locked-mode

      - name: Audit dependencies
        run: dotnet list BoardGameLibrary.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build BoardGameLibrary.sln --configuration Release --no-restore

      - name: Verify EF Core model and migrations are synchronized
        env:
          ConnectionStrings__BoardGameLibrary: Host=localhost;Port=5432;Database=board_game_library_ci;Username=postgres;Password=postgres
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/BoardGameLibrary.Infrastructure/BoardGameLibrary.Infrastructure.csproj
          --startup-project src/BoardGameLibrary.Api/BoardGameLibrary.Api.csproj
          --configuration Release
          --no-build

      - name: Test
        run: dotnet test BoardGameLibrary.sln --configuration Release --no-build
